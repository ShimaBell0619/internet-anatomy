name: Apply Issue 12 patch

on:
  push:
    branches:
      - feat/issue-12-experiential-motion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - run: python .github/scripts/issue12_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DnsStory.tsx tests/e2e/rendered.spec.ts PRODUCT.md DESIGN.md docs/ARCHITECTURE.md
          git commit -m "feat: make Story handoffs direct and experiential"
          git push origin HEAD:feat/issue-12-experiential-motion
