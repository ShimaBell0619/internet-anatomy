name: Publish v1.0.0

on:
  push:
    branches:
      - release/publish-v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish GitHub Release
        run: |
          cat > release-notes.md <<'EOF'
          # Internet Anatomy v1.0.0

          The first complete DNS learning release of Internet Anatomy.

          ## What ships

          - **Story** — a mostly viewport-fixed protocol theater where you directly activate DNS responsibility handoffs instead of paging through a lesson or answering a quiz.
          - **CNAME detour** — progressively reveal alias → canonical name → terminal A/AAAA ownership from observed DNS answers.
          - **Compare** — place two real hostnames under the same DNS lens to see shared ancestry and the first responsibility divergence.
          - **Cache / TTL Lab** — an explicit local simulation seeded from observed TTL values that shows answer-cache hits, delegation reuse, and path reopening after expiry.
          - **Break DNS Lab** — safely model NODATA, NXDOMAIN, missing delegation, and finite CNAME loops without changing real DNS.
          - **Explore** — inspect observed NS/SOA/A/AAAA/CNAME data and reconstructed namespace stages.
          - **Experiential motion** — short semantic handoff/reveal transitions with equivalent `prefers-reduced-motion` states; no fake packet animation or quiz mechanics.
          - **Shareable entry URLs** — share hostname + mode, comparison pairs, or Lab subsection with validation through the same hostname normalization path as typed input.

          ## Trust boundary

          Real DNS observations come from the Google Public DNS JSON DNS-over-HTTPS API. Story and Compare are explanatory projections, not packet captures or the user's actual resolver trace. Cache / TTL and Break DNS are local simulations, not visibility into Google Public DNS cache internals and not DNS mutations.

          ## Production

          https://internet-anatomy.vercel.app

          ## Validation

          Release target: `e069cde05bb15922f81ec252e1591be3dd9b07af`

          The exact release target passed Foundation `check`, `typecheck`, unit/component tests, production build, and E2E. Vercel production deployment completed successfully for the same SHA. Rendered review was completed at approximately 1440px, 390px, and 320px including reduced-motion states.
          EOF
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target e069cde05bb15922f81ec252e1591be3dd9b07af \
            --title "Internet Anatomy v1.0.0" \
            --notes-file release-notes.md \
            --latest
