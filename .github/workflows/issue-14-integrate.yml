name: Integrate Issue 14

on:
  push:
    branches:
      - feat/issue-14-failure-lab

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-14-failure-lab
      - name: Apply integration
        run: python3 .github/issue14_patch.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx PRODUCT.md DESIGN.md docs/ARCHITECTURE.md README.md tests/e2e/rendered.spec.ts
          git commit -m "feat: integrate Break DNS Lab"
          git push origin HEAD:feat/issue-14-failure-lab
