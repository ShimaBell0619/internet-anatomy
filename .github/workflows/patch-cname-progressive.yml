name: Apply final CNAME progressive patch

on:
  push:
    branches: [feat/issue-8-cname-story-stage]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove answer spoiler from alias scene
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/story.ts')
          text = path.read_text()
          old = """        alternatives: compactAlternatives([\n          alternative(answer, 'CNAME自体はIPアドレスではありません。まずRDATAが示す別のDNS名へバトンを渡します。'),\n          alternative(client, 'Resolverは別名の解決を続けてから、最終結果をClientへ返します。'),\n        ]),"""
          if old not in text:
              raise SystemExit('expected alias alternative block not found')
          path.write_text(text.replace(old, "        alternatives: [],", 1))

          test = Path('tests/e2e/rendered.spec.ts')
          text = test.read_text()
          needle = "  await expect(page.getByRole('heading', { name: 'CNAMEの行き先を追う' })).toBeVisible();"
          assertion = "  await expect(page.getByRole('button', { name: /ADDRESS A 140\\.82\\.112\\.4/ })).toHaveCount(0);"
          if needle not in text:
              raise SystemExit('expected CNAME e2e heading not found')
          if assertion not in text:
              text = text.replace(needle, needle + '\n' + assertion, 1)
          test.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/story.ts tests/e2e/rendered.spec.ts
          git commit -m "fix: keep CNAME address hidden until canonical step"
          git push origin HEAD:feat/issue-8-cname-story-stage
